<script>
'use strict';
(function(){
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search);
const PI=Math.PI,TAU=PI*2;
let W=0,H=0,DPR=1;
let rnd=Math.random;
const R=(a,b)=>a+(b-a)*rnd();
const RI=(a,b)=>Math.floor(a+(b-a+1)*rnd());
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const eob=x=>{x=clamp(x,0,1);const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const rotm=(m,r)=>{r&=3;return((m<<r)|(m>>(4-r)))&15};
const bits=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1);
const isCurve=m=>bits(m)===2&&m!==5&&m!==10;
function dirsOf(m){const r=[];for(let d=0;d<4;d++)if(m>>d&1)r.push(d);return r}
function canon(m){const n=bits(m);const base=n===4?15:n===3?7:n===2?((m===5||m===10)?5:3):1;for(let r=0;r<4;r++)if(rotm(base,r)===m)return{base,rot:r};return{base:m,rot:0}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU)}
/* ---------------- themes ---------------- */
const THEMES=[
{id:'spring',name:'春の庭',times:['朝','昼','夕'],g1:'#8cc863',g2:'#76b452',mat:'rgba(40,80,20,.16)',
 pipe:{rim:'#7a3f1c',body:'#c9773d',hi:'#f6c08c',ch:'#4e2914'},water:'#4cb2ef',card:'rgba(255,252,236,.34)',cardEdge:'rgba(90,70,30,.28)',back:'#3d7fb8',
 tg:['bed','bed','fountain','pond','wheel'],src:'spring',amb:'petal',rock:'#aaa69b',pal:['#ff8fb1','#ffd34d','#ff6a5c','#c48bff','#ffffff'],wall:'#f1e2c4',roof:'#c0533a'},
{id:'wa',name:'和の庭',times:['朝','昼','夕','夜'],g1:'#dcd5c1',g2:'#cdc5ae',mat:'rgba(80,70,40,.10)',
 pipe:{rim:'#46642a',body:'#8fb35a',hi:'#dbeaa8',ch:'#34481f',bamboo:true},water:'#59acd6',card:'rgba(120,92,52,.20)',cardEdge:'rgba(70,50,25,.30)',back:'#5b3d2a',
 tg:['shishi','pond','tsukubai','iris'],src:'kakei',amb:'leaf',rock:'#8f8a80',pal:['#6b4fd0','#9a7ae8','#ffffff','#7b5ce0'],wall:'#efe6d2',roof:'#4a4a52'},
{id:'oasis',name:'砂漠のオアシス',times:['昼','夕','夜'],g1:'#efd49c',g2:'#e0bf7e',mat:'rgba(120,80,20,.10)',
 pipe:{rim:'#7c3b1e',body:'#c7643a',hi:'#f0a37a',ch:'#552612'},water:'#36c2dc',card:'rgba(255,242,214,.30)',cardEdge:'rgba(120,70,30,.28)',back:'#b0522c',
 tg:['palm','palm','pool','bed'],src:'well',amb:'sand',rock:'#b89d75',pal:['#ff5c8a','#ffb03b','#ff3d3d','#ffffff'],wall:'#e9cf9e',roof:'#c98b4a'},
{id:'town',name:'灯りの町',times:['夕','夜'],g1:'#8d8a95',g2:'#7b7884',mat:'rgba(20,20,30,.12)',
 pipe:{rim:'#2c333d',body:'#6d7a88',hi:'#bcc8d5',ch:'#1b2129'},water:'#5aa9f0',card:'rgba(40,40,52,.20)',cardEdge:'rgba(0,0,0,.30)',back:'#2d3e66',
 tg:['house','house','fountain','wheel','house'],src:'tank',amb:'none',rock:'#9a968f',pal:['#ff8fb1','#ffd34d','#ff6a5c'],wall:'#e3c9a2',roof:'#8c3b2e'},
{id:'snow',name:'雪の村',times:['朝','昼','夕','夜'],g1:'#f2f6fb',g2:'#e2e9f2',mat:'rgba(60,90,130,.07)',
 pipe:{rim:'#4a3322',body:'#8a5d3b',hi:'#caa37d',ch:'#2b1d12'},water:'#6cc3f0',card:'rgba(140,165,200,.20)',cardEdge:'rgba(60,80,110,.25)',back:'#5d7fa8',
 tg:['onsen','house','wheel','pond'],src:'spring',amb:'snow',rock:'#8d929b',pal:['#ff6b6b','#ffd34d'],wall:'#b88a5e',roof:'#eef3f9',snowRoof:true}
];
const TIMES={'朝':{tint:'#ffeedd',nf:0},'昼':{tint:null,nf:0},'夕':{tint:'#ffbf8f',nf:.55},'夜':{tint:'#a2acdc',nf:1}};
const SPEEDS=[0.4,0.65,1,1.7,3];
const TURBO=+Q.get('turbo')||1;

/* ---------------- settings ---------------- */
const SET=Object.assign({mode:'auto',speed:'2',theme:'auto',time:'auto',sound:'off',info:'on'},(()=>{try{return JSON.parse(localStorage.getItem('suiro-settings')||'{}')}catch(e){return{}}})());
SET.sound='off'; // always start silent
function saveSet(){try{localStorage.setItem('suiro-settings',JSON.stringify(SET))}catch(e){}}
const spd=()=>SPEEDS[+SET.speed]*TURBO;

/* ---------------- audio ---------------- */
const AU={c:null,m:null,wg:null};
function auInit(){
  if(AU.c)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AU.c=new AC();AU.m=c.createGain();AU.m.gain.value=.55;AU.m.connect(c.destination);
  const len=c.sampleRate*3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.2}
  const src=c.createBufferSource();src.buffer=b;src.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=.6;
  AU.wg=c.createGain();AU.wg.gain.value=0;src.connect(bp);bp.connect(AU.wg);AU.wg.connect(AU.m);src.start();
}
const sOn=()=>SET.sound==='on'&&AU.c;
function tone(f,v,dur,type,delay,f2){if(!sOn())return;const c=AU.c,t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.05)}
function noiseHit(v,dur,freq,q,delay){if(!sOn())return;const c=AU.c,t=c.currentTime+(delay||0);const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.m);s.start(t)}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
const sfx={
 click(){tone(1100,.05,.06,'triangle',0,600);noiseHit(.05,.03,2500,2)},
 deal(){noiseHit(.04,.05,3200,1.5)},
 plink(){tone(pick(PENTA)*(rnd()<.5?1:2),.06,.5,'sine')},
 chime(){const b=RI(0,3);for(let k=0;k<3;k++)tone(PENTA[b+k*2]||PENTA[7],.07,.9,'sine',k*.09)},
 kakon(){tone(560,.16,.22,'triangle',0,500);noiseHit(.16,.06,1400,3);tone(830,.06,.15,'triangle',.01)},
 swap(){noiseHit(.06,.12,1800,1);tone(700,.04,.15,'sine',.08,1000)},
 valve(){noiseHit(.05,.25,500,2)}
};
function waterLevel(v){if(!AU.c)return;AU.wg.gain.setTargetAtTime(SET.sound==='on'?v:0,AU.c.currentTime,.6)}

/* ---------------- generation & solver ---------------- */
function generate(cols,rows){
  const N=cols*rows,id=(x,y)=>y*cols+x;
  for(let att=0;att<300;att++){
    const K=new Array(N).fill('empty'),M=new Array(N).fill(0);
    let sx,sy,sd;
    if(cols<rows||rnd()<.55){sx=RI(1,cols-2);sy=0;sd=2}else{sx=0;sy=RI(1,rows-2);sd=1}
    const src=id(sx,sy),p0=id(sx+DX[sd],sy+DY[sd]);
    K[src]='src';M[src]=1<<sd;K[p0]='pipe';M[p0]=1<<((sd+2)&3);
    const tree=new Uint8Array(N);tree[p0]=1;
    const nT=clamp(Math.round(N/14)+(rnd()<.4?1:0),3,6);
    const tg=[];
    for(let k=0;k<nT;k++){
      let best=-1,bs=-1;
      for(let tr=0;tr<14;tr++){
        const x=RI(0,cols-1),y=RI(0,rows-1),i=id(x,y);if(K[i]!=='empty')continue;
        const ds=Math.abs(x-sx)+Math.abs(y-sy);if(ds<3)continue;
        let mn=99,ok=true;for(const j of tg){const jx=j%cols,jy=j/cols|0;if(Math.abs(jx-x)<=1&&Math.abs(jy-y)<=1)ok=false;mn=Math.min(mn,Math.abs(jx-x)+Math.abs(jy-y))}
        if(!ok)continue;const sc=Math.min(mn,ds+1)+rnd()*1.5;if(sc>bs){bs=sc;best=i}
      }
      if(best<0)break;tg.push(best);K[best]='tgt';
    }
    if(tg.length<3)continue;
    const w=new Array(N).fill(0).map(()=>1+rnd()*rnd()*7);
    let fail=false;
    for(const t of shuffle(tg.slice())){
      const dist=new Array(N).fill(1e9),prev=new Array(N).fill(-1),done=new Uint8Array(N);dist[t]=0;let found=-1;
      for(;;){let u=-1,bd=1e9;for(let i=0;i<N;i++)if(!done[i]&&dist[i]<bd){bd=dist[i];u=i}
        if(u<0)break;done[u]=1;if(u!==t&&tree[u]){found=u;break}
        const ux=u%cols,uy=u/cols|0;
        for(let d=0;d<4;d++){const x=ux+DX[d],y=uy+DY[d];if(x<0||y<0||x>=cols||y>=rows)continue;const v=id(x,y);if(K[v]==='src'||K[v]==='tgt')continue;
          if(K[v]==='pipe'&&!tree[v])continue;if(tree[v]&&bits(M[v])>=4)continue;
          const nd=bd+(tree[v]?1.2:w[v]);if(nd<dist[v]){dist[v]=nd;prev[v]=u}}}
      if(found<0){fail=true;break}
      let v=found;while(v!==t){const u=prev[v];const ux=u%cols,uy=u/cols|0,vx=v%cols,vy=v/cols|0;
        const d=vx>ux?1:vx<ux?3:vy>uy?2:0;M[u]|=1<<d;M[v]|=1<<((d+2)&3);
        if(u!==t){K[u]='pipe';tree[u]=1}v=u}
    }
    if(fail)continue;
    let pc=0,bad=false;for(let i=0;i<N;i++)if(K[i]==='pipe'){pc++;if(bits(M[i])<2)bad=true}
    if(bad||pc<N*.34)continue;
    return{K,M,src,tg};
  }
  return null;
}
function solveBoard(cols,rows,cells){
  const N=cols*rows,dom=new Array(N),kind=cells.map(c=>c.kind);
  for(const c of cells){if(c.kind==='pipe'){const s=new Set();for(let r=0;r<4;r++)s.add(rotm(c.base,r));dom[c.i]=[...s]}else dom[c.i]=[c.kind==='empty'?0:c.fmask]}
  const ev=[];let guesses=0,nodes=0;
  const nb=(i,d)=>{const x=i%cols+DX[d],y=(i/cols|0)+DY[d];return(x<0||y<0||x>=cols||y>=rows)?-1:y*cols+x};
  function prop(D,q){const inQ=new Uint8Array(N);for(const i of q)inQ[i]=1;q=q.slice();
    while(q.length){const i=q.shift();inQ[i]=0;const b=D[i].length;
      const nd=D[i].filter(m=>{for(let d=0;d<4;d++){const o=m>>d&1,j=nb(i,d);if(j<0){if(o)return false;continue}const od=(d+2)&3;if(!D[j].some(m2=>(m2>>od&1)===o))return false}return true});
      if(!nd.length)return false;
      if(nd.length<b){D[i]=nd;if(nd.length===1&&kind[i]==='pipe')ev.push({k:'set',i,m:nd[0]});for(let d=0;d<4;d++){const j=nb(i,d);if(j>=0&&!inQ[j]){inQ[j]=1;q.push(j)}}}}
    return true}
  function conn(D){let s=-1,tot=0;for(let i=0;i<N;i++){if(D[i][0])tot++;if(kind[i]==='src')s=i}
    const seen=new Uint8Array(N),st=[s];seen[s]=1;let n=0;while(st.length){const i=st.pop();n++;const m=D[i][0];for(let d=0;d<4;d++)if(m>>d&1){const j=nb(i,d);if(j>=0&&!seen[j]){seen[j]=1;st.push(j)}}}return n===tot}
  function search(D){if(++nodes>40000)return null;let best=-1,bl=9;for(let i=0;i<N;i++){const l=D[i].length;if(l>1&&l<bl){bl=l;best=i}}
    if(best<0)return conn(D)?D:null;
    for(const m of D[best]){const D2=D.map(a=>a.slice());D2[best]=[m];guesses++;ev.push({k:'try',i:best,m});
      const ns=[];for(let d=0;d<4;d++){const j=nb(best,d);if(j>=0)ns.push(j)}
      if(prop(D2,ns)){const r=search(D2);if(r)return r}
      ev.push({k:'undo',i:best})}
    return null}
  if(!prop(dom,[...Array(N).keys()]))return null;
  const res=search(dom);if(!res)return null;
  return{masks:res.map(a=>a[0]),events:ev,guesses,nodes};
}
function curMask(c){return c.kind==='pipe'?rotm(c.base,c.rot):c.kind==='empty'?0:c.fmask}
function validateCells(cols,rows,cells){
  const N=cols*rows;let s=cells.find(c=>c.kind==='src');const seen=new Uint8Array(N),st=[s.i];seen[s.i]=1;let leaks=0,cracked=0;
  const nb=(i,d)=>{const x=i%cols+DX[d],y=(i/cols|0)+DY[d];return(x<0||y<0||x>=cols||y>=rows)?-1:y*cols+x};
  while(st.length){const i=st.pop();const c=cells[i];if(c.cracked)cracked++;const m=curMask(c);
    for(let d=0;d<4;d++)if(m>>d&1){const j=nb(i,d);if(j<0||!(curMask(cells[j])>>((d+2)&3)&1)){leaks++;continue}if(!seen[j]){seen[j]=1;st.push(j)}}}
  const tg=cells.filter(c=>c.kind==='tgt');const reached=tg.filter(c=>seen[c.i]).length;
  return{ok:leaks===0&&reached===tg.length&&cracked===0,leaks,reached,targets:tg.length,cracked,seen};
}
function buildPuzzle(cols,rows){
  for(let a=0;a<40;a++){
    const g=generate(cols,rows);if(!g)continue;
    const cells=[];
    for(let i=0;i<cols*rows;i++){const c={i,x:i%cols,y:i/cols|0,kind:g.K[i],rot:0,vis:0,animP:1,animFrom:0,swapP:1,flash:null,dist:-1,entry:-1};
      if(c.kind==='pipe'){const cn=canon(g.M[i]);c.base=cn.base;c.genRot=cn.rot}else c.fmask=g.M[i];cells.push(c)}

function drawPlumber(c,t){const s=L.cs,pl=S.pl;const x=L.bx+(pl.gx+.5)*s+s*.3,y0=L.by+(pl.gy+.5)*s+s*.36;

  c.fillStyle='#2f6fc4';rr(c,-9*k,-22*k,18*k,18*k,5*k);c.fill();c.fillStyle='#e04a3a';c.fillRect(-9*k,-24*k,18*k,6*k);
  c.fillStyle='#f0c84a';circ(c,-4*k,-15*k,1.5*k);c.fill();circ(c,4*k,-15*k,1.5*k);c.fill();

  c.fillStyle='#2a1a10';circ(c,-3*k,-30*k,1.3*k);c.fill();circ(c,3*k,-30*k,1.3*k);c.fill();c.fillStyle='#6a3a1a';c.beginPath();c.ellipse(0,-26*k,5*k,1.8*k,0,0,TAU);c.fill();

/* ---------------- actions ---------------- */
const A={
 walk(cell){const fx=S.pl.gx,fy=S.pl.gy,tx=cell.x,ty=cell.y,d=Math.hypot(tx-fx,ty-fy);return{dur:d<.01?0:clamp(d*.13,.18,.75),start(){S.pl.walking=true},tick(p){const e=ease(p);S.pl.gx=lerp(fx,tx,e);S.pl.gy=lerp(fy,ty,e)},end(){S.pl.walking=false;S.pl.gx=tx;S.pl.gy=ty}}},
 rot(cell){return{dur:.26,start(){cell.animFrom=cell.vis;cell.vis++;cell.animP=0;S.pl.work=true},tick(p){cell.animP=p},end(){cell.animP=1;cell.rot=cell.vis&3;S.pl.work=false;sfx.click();S.dirty=true;S.rotCount=(S.rotCount||0)+1}}},
 swap(cell){return{dur:.7,start(){cell.swapP=0;S.pl.work=true;sfx.swap()},tick(p){cell.swapP=p;if(p>=.5)cell.cracked=false},end(){cell.swapP=1;cell.cracked=false;S.pl.work=false;S.dirty=true;const x=cxOf(cell),y=cyOf(cell);for(let k=0;k<6;k++)addP({k:'spark',x,y,vx:R(-40,40),vy:R(-60,-10),life:0,max:.7,r:L.cs*.07})}}},

 pause(d){return{dur:d}},
 valve(){return{dur:1.3,start(){S.pl.work=true;sfx.valve()},tick(p){S.valveAng=ease(p)*TAU*1.25},end(){S.valveOpen=true;S.pl.work=false}}}
};
function runActs(gdt){let guard=0;while(guard++<60){if(!S.cur){if(!S.acts.length)return;S.cur=S.acts.shift();S.cur.t=0;S.cur.start&&S.cur.start()}
  const need=S.cur.dur-S.cur.t,use=Math.min(need,gdt);S.cur.t+=use;gdt-=use;S.cur.tick&&S.cur.tick(S.cur.dur?S.cur.t/S.cur.dur:1);
  if(S.cur.t>=S.cur.dur-1e-9){S.cur.end&&S.cur.end();S.cur=null}else return}}
const busy=()=>!!S.cur||S.acts.length>0;
function turnsTo(c,m){for(let k=0;k<4;k++)if(rotm(c.base,(c.rot+k)&3)===m)return k;return 0}
function stepActs(ev){const c=S.cells[ev.i];
  if(ev.k==='undo')return[A.walk(c),A.flash(c,'rgba(255,110,110,.95)',.45)];
  const k=turnsTo(c,ev.m);
  if(k===0&&!c.cracked)return[A.flash(c,ev.k==='try'?'rgba(255,220,90,.95)':'rgba(150,240,150,.95)',.14)];
  const a=[A.walk(c)];if(ev.k==='try')a.push(A.flash(c,'rgba(255,220,90,.95)',.2));if(c.cracked)a.push(A.swap(c));for(let j=0;j<k;j++)a.push(A.rot(c));a.push(A.pause(.1));return a}

/* ---------------- phases ---------------- */
const PH_TXT={intro:'新しい庭',deal:'管のカードを配っています',think:'AIが盤面を読んでいます',solve:'AIが管をつないでいます',manual:'管をタップして回してください',valve:'バルブを開けます',flow:'水が流れています',celebrate:'水が届きました',outro:'次の庭へ'};
function startSolvePlayback(fromSolver){

  const last=new Map();S.play.forEach(e=>{if(e.k!=='undo')last.set(e.i,e.m)});
  for(const c of S.cells)if(c.kind==='pipe'&&(last.has(c.i)?last.get(c.i):curMask(c))!==S.sol.masks[c.i])S.play.push({k:'set',i:c.i,m:S.sol.masks[c.i]});
  for(const c of S.cells)if(c.kind==='pipe'&&c.cracked&&!S.play.some(e=>e.i===c.i&&e.k!=='undo'))S.play.push({k:'set',i:c.i,m:S.sol.masks[c.i]});

function validate(){return validateCells(S.cols,S.rows,S.cells)}

  if(!v.ok){entry.fallback=true;for(const c of S.cells)if(c.kind==='pipe'){for(let r=0;r<4;r++)if(rotm(c.base,r)===S.sol.masks[c.i]){c.rot=r;c.vis=r;c.animP=1;break}c.cracked=false}v=validate();entry.okAfter=v.ok;console.warn('playback mismatch; snapped to solution')}

  S.phase='valve';S.pt=0;const vc=S.valveI>=0?S.cells[S.valveI]:null;S.acts=vc?[A.walk(vc),A.valve(),A.pause(.25)]:[A.pause(.5)]}
function startFlow(){
  for(const c of S.cells){c.dist=-1;c.entry=-1}const s=S.cells[S.srcI];s.dist=0;const q=[s];
  while(q.length){const c=q.shift();const m=curMask(c);for(let d=0;d<4;d++)if(m>>d&1){const x=c.x+DX[d],y=c.y+DY[d];if(x<0||y<0||x>=S.cols||y>=S.rows)continue;const n=S.cells[y*S.cols+x];if(n.dist>=0)continue;n.dist=c.dist+1;n.entry=(d+2)&3;q.push(n)}}

  S.pl.gx=s.x;S.pl.gy=s.y}
function update(dt,gdt){
  S.pt+=gdt;const th=S.theme;
  switch(S.phase){
  case'intro':if(S.pt>2.2){S.phase='deal';S.pt=0;const pipes=S.cells.filter(c=>c.kind==='pipe');pipes.sort((a,b)=>(a.y-b.y)||(a.x-b.x));pipes.forEach((c,k)=>{c.dealAt=k*.085;c.dealt=false;c.dealSnd=false})}break;
  case'deal':{let all=true,mx=0;for(const c of S.cells)if(c.kind==='pipe'){mx=Math.max(mx,c.dealAt);if(!c.dealSnd&&S.pt>=c.dealAt){c.dealSnd=true;sfx.deal()}if(S.pt>=c.dealAt+.45)c.dealt=true;else all=false}
    if(all&&S.pt>mx+.8){S.phase=SET.mode==='manual'?'manual':'think';S.pt=0}}break;

  case'manual':runActs(gdt);if(!busy()&&S.dirty){S.dirty=false;if(validate().ok)finishSolve()}break;

    for(const c of S.tgts){if(c.tg.alive<0&&c.dist>=0&&S.flowT>=c.dist){c.tg.alive=0;sfx.chime();const x=cxOf(c),y=cyOf(c);for(let k=0;k<10;k++)addP({k:'spark',x:x+R(-.3,.3)*L.cs,y:y+R(-.3,.3)*L.cs,vx:R(-30,30),vy:R(-60,-20),life:0,max:1,r:L.cs*R(.05,.09)})}}
    if(S.phase==='flow'&&S.flowT>=S.maxDist+.4){S.phase='celebrate';S.pt=0}
    if(S.phase==='celebrate'){if(rnd()<dt*.9)sfx.plink();if(S.pt>9){S.phase='outro';S.pt=0;waterLevel(0)}}

      else if(g.type==='onsen'){while(g.acc>.18){g.acc-=.18;addP({k:'steam',x:x+R(-.3,.3)*s,y:y+R(-.2,.2)*s,vx:R(-4,4),vy:-s*R(.25,.45),life:0,max:R(1.6,2.6),r:s*R(.05,.09),ph:R(0,TAU)})}}
      else if(g.type==='house'&&(th.id==='snow'||curTime()!=='昼')){while(g.acc>.35){g.acc-=.35;addP({k:'smoke',x:x+s*.2,y:y-s*.42,vx:R(4,10),vy:-s*R(.2,.3),life:0,max:2.2,r:s*.04,ph:R(0,TAU)})}}
      else if(g.type==='wheel'){while(g.acc>.08){g.acc-=.08;addP({k:'drop',x:x-s*.18+R(-.2,.2)*s,y:y+s*.25,z:s*.05,vx:R(-.3,.3)*s,vy:R(-.05,.05)*s,vz:s*R(.6,1.1),life:0,max:2,r:s*.015})}}

          if(tp>=.85){g.tip=-1;g.fill=0;g.tipAng=0;g.knocks=(g.knocks||0)+1;sfx.kakon();addP({k:'txt',txt:'カコーン',x,y:y-s*.3,vx:0,vy:-s*.25,life:0,max:1.4,r:Math.max(11,s*.16)})}}}
    }}
  updParts(dt);
}

  if(S.phase==='think'){const f=clamp(S.pt/1.3,0,1),x=L.bx+f*S.cols*s;const g=c.createLinearGradient(x-s,0,x+s*.2,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.35)');c.fillStyle=g;c.fillRect(x-s,L.by,s*1.2,S.rows*s)}

      else if(cell.tg.type==='wheel')glow(x+s*.22,y-s*.03,s*.5,'255,200,110',.45*a*nf);
      else glow(x,y,s*.6,'120,200,255',.18*a*nf)}
    if(flowing)for(const cell of S.cells)if(cell.kind==='pipe'&&cell.dist>=0&&S.flowT>=cell.dist)glow(cxOf(cell),cyOf(cell),s*.45,'90,170,255',.10*nf);
    for(const p of S.parts)if(p.k==='ff'){const a=(.5+.5*Math.sin(t*3+p.ph))*Math.sin(clamp(p.life/p.max,0,1)*PI);glow(p.x,p.y,10,'200,255,120',.9*a)}
    c.restore()}
  if(S.phase==='intro'){const p=S.pt/2.2,a=p<.2?p/.2:p>.8?(1-p)/.2:1;c.save();c.globalAlpha=clamp(a,0,1);c.fillStyle='rgba(10,20,25,.35)';const bh=Math.min(130,H*.2);c.fillRect(0,H/2-bh/2,W,bh);
    c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=8;
    c.font=`${Math.min(16,W*.04)}px sans-serif`;c.fillText(`第${S.stageNo}面`,W/2,H/2-bh*.3);
    c.font=`bold ${Math.min(40,W*.085)}px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif`;c.fillText(th.name,W/2,H/2+bh*.02);
    c.font=`${Math.min(18,W*.045)}px sans-serif`;c.fillText(`― ${tm} ―`,W/2,H/2+bh*.33);c.restore()}
  if(S.phase==='outro'){c.fillStyle=`rgba(12,18,22,${ease(S.pt/1.5)*.85})`;c.fillRect(0,0,W,H)}
  if(S.phase==='intro'&&S.pt<.5&&S.stageNo>1){c.fillStyle=`rgba(12,18,22,${(1-S.pt/.5)*.85})`;c.fillRect(0,0,W,H)}
}

/* ---------------- icon mode ---------------- */
function drawIcon(N){
  W=H=N;DPR=1;cv.width=cv.height=N;cv.style.width=cv.style.height=N+'px';const c=ctx;c.setTransform(1,0,0,1,0,0);
  const th=THEMES[0];const g=c.createLinearGradient(0,0,N,N);g.addColorStop(0,'#9ad36d');g.addColorStop(1,'#6eae4a');c.fillStyle=g;c.fillRect(0,0,N,N);
  const s=N*.4,ox=N/2-s,oy=N/2-s;const at=(x,y,f)=>{c.save();c.translate(ox+(x+.5)*s,oy+(y+.5)*s);f();c.restore()};
  const gg={blob:[...Array(10)].map((_,k)=>1+Math.sin(k*1.7)*.06),seed:1,pal:['#ff8fb1','#ffd34d','#ff6a5c','#c48bff','#ffffff'],ang:.3};
  at(1,0,()=>{drawCard(c,s,th,false);drawPipe(c,12,s,th.pipe,{p:1,e:-1,t:.3,water:th.water})});
  at(0,1,()=>{drawPipe(c,1,s,th.pipe,{p:1,e:0,t:0,water:th.water});TD.bed(c,s,1,.5,gg,th)});
  at(0,0,()=>{drawPipe(c,2,s,th.pipe,{p:1,e:-1,t:0,water:th.water});drawPipe(c,4,s,th.pipe,{p:1,e:-1,t:0,water:th.water});drawSource(c,s,th,.2)});
  at(1,1,()=>{drawPipe(c,1,s,th.pipe,{p:1,e:0,t:0,water:th.water});TD.fountain(c,s,1,.4,gg,th);
    c.fillStyle='rgba(215,240,255,.95)';for(let k=0;k<18;k++){const an=k/18*TAU,r=s*.3;for(let j=1;j<6;j++){const f=j/6;circ(c,Math.cos(an)*r*f,Math.sin(an)*r*f*.8-Math.sin(f*PI)*s*.3,s*.017);c.fill()}}});
  for(const[px,py,col]of[[.1,.92,'#ff8fb1'],[.9,.08,'#ffd34d'],[.92,.9,'#ff6a5c'],[.07,.1,'#c48bff']])flower(c,px*N,py*N,N*.04,col);
}

/* ---------------- UI ---------------- */
const panel=$('#panel'),status=$('#status');
function syncUI(){document.querySelectorAll('.seg').forEach(sg=>{const k=sg.dataset.k;sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(SET[k])))});status.classList.toggle('off',SET.info==='off')}
function setOpt(k,v){const old=SET[k];SET[k]=v;saveSet();syncUI();
  if(k==='sound'){if(v==='on'){auInit();if(AU.c&&AU.c.resume)AU.c.resume();waterLevel(S.phase==='flow'||S.phase==='celebrate'?.08:0)}else waterLevel(0)}
  if(k==='theme'&&v!==old){if(v==='auto')S.themeIdx=THEMES.findIndex(t=>t.id===S.theme.id);newStage()}
  if(k==='mode'&&v!==old){if(v==='manual'){if(S.phase==='think'||S.phase==='solve'){S.play=[];S.pi=0;S.phase='manual';S.dirty=true}}else if(S.phase==='manual'){S.acts=[];startSolvePlayback(false)}}
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setOpt(b.parentElement.dataset.k,b.dataset.v);poke()}));
$('#gear').addEventListener('click',e=>{e.stopPropagation();panel.classList.toggle('open');poke()});
$('#nextBtn').addEventListener('click',e=>{e.stopPropagation();newStage();poke()});
const fsOK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!fsOK)$('#fsBtn').style.display='none';
$('#fsBtn').addEventListener('click',e=>{e.stopPropagation();const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{})}}catch(err){}});
let idleT=0;function poke(){idleT=0;document.body.classList.remove('idle')}
['pointermove','keydown'].forEach(ev=>addEventListener(ev,poke));
cv.addEventListener('pointerdown',e=>{poke();
  if(panel.classList.contains('open')){panel.classList.remove('open');return}
  if(SET.mode==='manual'&&S.phase==='manual'){const gx=Math.floor((e.clientX-L.bx)/L.cs),gy=Math.floor((e.clientY-L.by)/L.cs);
    if(gx>=0&&gy>=0&&gx<S.cols&&gy<S.rows){const c=S.cells[gy*S.cols+gx];if(c.kind==='pipe'&&S.acts.length<3)S.acts.push(c.cracked?A.swap(c):A.rot(c))}}});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(AU.c){if(document.hidden)AU.c.suspend();else if(SET.sound==='on')AU.c.resume()}});

/* ---------------- boot ---------------- */
window.__suiro={state:()=>({stage:S.stageNo,theme:S.theme.id,time:curTime(),phase:S.phase,mode:SET.mode,speed:SET.speed,cols:S.cols,rows:S.rows,cs:L.cs,flowT:S.flowT,
   alive:S.tgts.filter(c=>c.tg.alive>=0).length,targets:S.tgts.map(c=>c.tg.type),wheelAngs:S.tgts.filter(c=>c.tg.type==='wheel').map(c=>c.tg.ang),
   knocks:S.tgts.filter(c=>c.tg.type==='shishi').map(c=>c.tg.knocks||0),drops:S.parts.filter(p=>p.k==='drop').length,steam:S.parts.filter(p=>p.k==='steam').length,
   rotCount:S.rotCount||0,log:S.log,guesses:S.sol.guesses,valid:(({ok,leaks,reached,targets,cracked})=>({ok,leaks,reached,targets,cracked}))(validate())}),
 setOpt,next:()=>newStage(),
 cellPoint:i=>({x:cxOf(S.cells[i]),y:cyOf(S.cells[i])}),
 cells:()=>S.cells.map(c=>({i:c.i,kind:c.kind,base:c.base,rot:c.rot,cracked:!!c.cracked,sol:c.kind==='pipe'?S.sol.masks[c.i]:null})),
 stress(n,cols,rows){let ok=0,fail=0,guess=0,maxG=0,withG=0;for(let k=0;k<n;k++){const pz=buildPuzzle(cols,rows);if(!pz){fail++;continue}
   const v=validateCells(cols,rows,pz.cells);const allSet=pz.cells.every(c=>c.kind!=='pipe'||rotm(c.base,c.solRot)===pz.sol.masks[c.i]);
   const tgOK=pz.cells.filter(c=>c.kind==='tgt').length>=3;if(v.ok&&allSet&&tgOK)ok++;else fail++;guess+=pz.sol.guesses;if(pz.sol.guesses)withG++;maxG=Math.max(maxG,pz.sol.guesses)}
   return{n,ok,fail,avgGuesses:guess/n,puzzlesNeedingGuess:withG,maxGuesses:maxG}}};
const iconN=+Q.get('icon');
if(iconN){document.querySelectorAll('.ui').forEach(e=>e.remove());drawIcon(iconN);return}
for(const k of['theme','time','mode','speed'])if(Q.get(k))SET[k]=Q.get(k);
resize();syncUI();
newStage();
let last=performance.now()/1000;
function frame(ms){const now=ms/1000;const dt=Math.min(.05,Math.max(0,now-last));last=now;idleT+=dt;if(idleT>3.5&&!panel.classList.contains('open'))document.body.classList.add('idle');
  const steps=Math.max(1,Math.ceil(TURBO/2));for(let k=0;k<steps;k++)update(dt/steps,dt*spd()/steps);render(now);
  if(SET.info==='on')status.textContent=`第${S.stageNo}面　${S.theme.name}・${curTime()}　${PH_TXT[S.phase]||''}`;
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
